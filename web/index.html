<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masterclass en vivo</title>
  <meta name="description" content="Masterclass gratuita en vivo. Regístrate y entra al grupo privado de WhatsApp.">
  <meta property="og:title" content="Masterclass gratuita en vivo">
  <meta property="og:description" content="Cupos abiertos solo por 24 horas. Regístrate y entra al grupo de WhatsApp.">
  <meta property="og:type" content="website">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <main class="wrap">
    <span class="tag" id="etiqueta"></span>
    <h1 id="titulo"></h1>
    <p class="sub" id="subtitulo"></p>

    <section id="bloqueContador">
      <p class="countdown-label" id="contadorTexto"></p>
      <div class="countdown" aria-live="polite">
        <div class="unit"><b id="hh">--</b><small>Horas</small></div>
        <div class="unit"><b id="mm">--</b><small>Min</small></div>
        <div class="unit"><b id="ss">--</b><small>Seg</small></div>
      </div>
    </section>

    <form id="registro" novalidate>
      <label for="nombre">Nombre</label>
      <input id="nombre" name="nombre" type="text" autocomplete="name" required placeholder="Tu nombre">

      <label for="email">Correo electrónico</label>
      <input id="email" name="email" type="email" autocomplete="email" required placeholder="tu@correo.com">

      <label for="telefono">WhatsApp (opcional)</label>
      <input id="telefono" name="telefono" type="tel" autocomplete="tel" placeholder="+57 300 000 0000">

      <button type="submit" id="btn"></button>
      <p class="msg" id="msg"></p>
      <p class="legal" id="avisoLegal"></p>
    </form>

    <section class="closed" id="cerrado">
      <h2 id="cerradoTitulo"></h2>
      <p class="sub" id="cerradoTexto"></p>
    </section>

    <ul class="points" id="puntos"></ul>
  </main>

  <noscript><p style="text-align:center;padding:16px">Activa JavaScript para registrarte.</p></noscript>

  <script src="config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
